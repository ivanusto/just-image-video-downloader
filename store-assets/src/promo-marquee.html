<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1400px; height: 560px; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: linear-gradient(125deg, #0a0f1c 0%, #101a2e 45%, #1c2f4d 100%);
  color: #fff;
  position: relative;
}
.left {
  position: absolute; left: 90px; top: 50%; transform: translateY(-50%);
  width: 640px;
}
.logo-row { display: flex; align-items: center; gap: 24px; }
.logo {
  width: 84px; height: 84px; border-radius: 50%; flex: 0 0 84px;
  background: radial-gradient(circle at 35% 30%, #3b82f6, #1d4ed8);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 28px rgba(37, 99, 235, 0.45);
}
.logo svg { width: 38px; height: 38px; }
h1 { font-size: 46px; font-weight: 800; line-height: 1.18; letter-spacing: -0.5px; }
.tag { color: #7fb2f0; font-size: 25px; font-weight: 700; margin-top: 22px; }
.chips { display: flex; gap: 12px; margin-top: 26px; }
.chip {
  border: 1px solid rgba(110, 150, 220, 0.45);
  background: rgba(37, 99, 235, 0.13);
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 16.5px;
  color: #dce7f5;
  white-space: nowrap;
}
.card {
  position: absolute; left: 860px; top: 60px; width: 400px;
  background: #0d1524; border-radius: 16px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}
.card-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; background: #0b111f;
}
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #e879b9, #a855f7);
}
.handle { font-weight: 700; font-size: 15px; }
.img {
  position: relative; height: 300px;
  background: linear-gradient(120deg, #7c4dcc 0%, #9a6ad0 35%, #e8a13c 80%, #f5c04a 100%);
}
.sun {
  position: absolute; right: 70px; top: 52px; width: 58px; height: 58px;
  border-radius: 50%; background: #f7e8b0;
  box-shadow: 0 0 38px 16px rgba(247, 232, 176, 0.45);
}
.dl-btn {
  position: absolute; left: 16px; top: 16px;
  width: 42px; height: 42px; border-radius: 50%;
  background: #2563eb; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(0,0,0,0.35);
}
.dl-btn svg { width: 20px; height: 20px; }
.tooltip {
  position: absolute; left: 14px; top: 70px;
  background: #0b111f; color: #fff; font-size: 14px; font-weight: 600;
  padding: 8px 13px; border-radius: 8px; white-space: nowrap;
  box-shadow: 0 6px 18px rgba(0,0,0,0.4);
}
.post-footer {
  display: flex; align-items: center; gap: 20px;
  padding: 14px 16px; background: #0b111f; color: #c3cfdf; font-size: 14px;
}
</style></head>
<body>
  <div class="left">
    <div class="logo-row">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M4 21h16"/>
        </svg>
      </div>
      <h1>Just Image &amp;<br>Video Downloader</h1>
    </div>
    <div class="tag">One-click original-quality image &amp; video downloads</div>
    <div class="chips">
      <span class="chip">📸 Original max quality</span>
      <span class="chip">🔒 100% local</span>
      <span class="chip">🚫 No login · No tracking</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="avatar"></div>
      <span class="handle">sample_creator</span>
    </div>
    <div class="img">
      <div class="sun"></div>
      <div class="dl-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M4 21h16"/>
        </svg>
      </div>
      <div class="tooltip">Download image</div>
    </div>
    <div class="post-footer">
      <span>♡ 1,024</span><span>💬 88</span><span>↗ Share</span>
    </div>
  </div>
</body></html>
